name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6  # version from package.json `packageManager`
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint
      - run: make type-check
      - run: make check-docs      # every README snippet compiles against the SDK
      - run: make check-package   # exports map and dual ESM/CJS types
